<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Public, timestamped GripeToGold trend history and prediction outcomes."/>
  <title>GripeToGold — Public Trend History</title>
  <style>
    :root { --bg:#080808; --panel:#121212; --line:#292929; --text:#f4f4f4; --muted:#969696; --red:#e8291c; --green:#42c77a; }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 Inter,system-ui,sans-serif; }
    a { color:inherit; text-decoration:none; }
    nav { display:flex; justify-content:space-between; align-items:center; padding:20px max(24px,calc((100vw - 1040px)/2)); border-bottom:1px solid var(--line); }
    .logo { font-weight:900; } .logo span { color:var(--red); }
    .back { color:var(--muted); }
    main { max-width:1040px; margin:auto; padding:80px 24px; }
    .eyebrow { color:var(--red); text-transform:uppercase; letter-spacing:.14em; font-size:11px; font-weight:800; }
    h1 { font-size:clamp(38px,7vw,72px); line-height:1.02; letter-spacing:-.05em; margin:14px 0 22px; max-width:850px; }
    .lead { color:var(--muted); font-size:18px; max-width:720px; }
    .method { margin:38px 0 48px; padding:18px 20px; border:1px solid var(--line); background:var(--panel); border-radius:12px; color:var(--muted); }
    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:16px; }
    .card { border:1px solid var(--line); background:var(--panel); border-radius:14px; padding:22px; }
    .meta { color:var(--muted); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
    .card h2 { font-size:19px; line-height:1.25; margin:12px 0; }
    .outcome { color:var(--green); font-weight:800; }
    .empty { padding:48px; border:1px dashed var(--line); border-radius:14px; text-align:center; color:var(--muted); }
    .empty strong { display:block; color:var(--text); font-size:20px; margin-bottom:8px; }
    @media (max-width:760px) { .grid { grid-template-columns:1fr; } main { padding-top:52px; } }
  </style>
</head>
<body>
  <nav><a class="logo" href="./">Gripe<span>To</span>Gold</a><a class="back" href="./">Back to home</a></nav>
  <main>
    <p class="eyebrow">Public evidence log</p>
    <h1>Past signals, tracked in public.</h1>
    <p class="lead">This page records what GripeToGold identified, when it was published, what happened next, and whether the original call held up. No retroactive wins and no invented history.</p>
    <div class="method" id="method">Loading methodology…</div>
    <section class="grid" id="trendGrid" aria-live="polite"></section>
  </main>
  <script>
    const grid = document.querySelector('#trendGrid');
    const method = document.querySelector('#method');
    fetch('./trends.json', { cache: 'no-store' })
      .then((response) => {
        if (!response.ok) throw new Error('Trend history unavailable');
        return response.json();
      })
      .then((data) => {
        method.textContent = data.methodology;
        const trends = Array.isArray(data.trends) ? data.trends : [];
        if (!trends.length) {
          grid.className = 'empty';
          grid.innerHTML = '<strong>No verified outcomes published yet.</strong>The log starts empty by design. The first entry will appear only after a timestamped prediction has completed its evaluation window.';
          return;
        }
        grid.innerHTML = trends.map((trend) => `
          <article class="card">
            <div class="meta">${escapeHtml(trend.published_month)} · ${escapeHtml(trend.category)}</div>
            <h2>${escapeHtml(trend.title)}</h2>
            <p>${escapeHtml(trend.prediction)}</p>
            <p class="outcome">${escapeHtml(trend.outcome)}</p>
            <p class="meta">Evidence checked ${escapeHtml(trend.evaluated_at)}</p>
          </article>`).join('');
      })
      .catch(() => {
        method.textContent = 'Verified predictions are published with timestamps and evidence windows.';
        grid.className = 'empty';
        grid.innerHTML = '<strong>Trend history is temporarily unavailable.</strong>Please check again shortly.';
      });
    function escapeHtml(value) {
      return String(value || '').replace(/[&<>'"]/g, (char) => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' })[char]);
    }
  </script>
</body>
</html>
